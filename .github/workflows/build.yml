name: Build Bootable OS ISO

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-multilib binutils grub-pc-bin grub-common xorriso mtools

      - name: Assemble bootloader
        run: as --32 boot.s -o boot.o

      - name: Compile kernel
        run: gcc -m32 -ffreestanding -O2 -Wall -Wextra -fno-pie -fno-stack-protector -c kernel.c -o kernel.o

      - name: Link kernel binary
        run: ld -m elf_i386 -T linker.ld -nostdlib boot.o kernel.o -o myos.bin

      - name: Verify Multiboot header
        run: grub-file --is-x86-multiboot myos.bin

      - name: Build bootable ISO
        run: |
          mkdir -p isodir/boot/grub
          cp myos.bin isodir/boot/myos.bin
          cat << 'EOF' > isodir/boot/grub/grub.cfg
          set timeout=0
          set default=0

          menuentry "My Custom OS" {
              multiboot /boot/myos.bin
              boot
          }
          EOF
          grub-mkrescue -o my-custom-os.iso isodir

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: my-custom-os-iso
          path: my-custom-os.iso
